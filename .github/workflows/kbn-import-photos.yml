name: Import KBN verified menu photographs
on:
  push:
    paths:
      - .github/workflows/kbn-import-photos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install image processing dependency
        run: python -m pip install --quiet Pillow
      - name: Download and optimize generated dish photographs
        shell: bash
        run: |
          python - <<'PY'
          import csv,io,urllib.request,pathlib,subprocess
          from PIL import Image
          FILES = {"gorur-kosha-bhuna-v3.jpg":"https://oaisdmntprcentralindia.blob.core.windows.net/files/00000000-133c-8208-b408-edc5acc0af76/raw?se=2026-11-05T00%3A05%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=8b1de273-798c-4867-b205-57e47b7913fa&skoid=f2622f62-3126-45cd-85e0-0bc840c3afdc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-04T22%3A31%3A23Z&ske=2026-11-05T22%3A31%3A23Z&sks=b&skv=2026-02-06&sig=2QbOt0Ss9vsK7teH%2BDscAlSHfREH8nGW9AHnBUPGj0Q%3D","murgir-ran-fry-v3.jpg":"https://oaisdmntprcentralindia.blob.core.windows.net/files/00000000-15b0-8208-9251-f6ffcc52cf9c/raw?se=2026-11-05T00%3A05%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=8b1de273-798c-4867-b205-57e47b7913fa&skoid=f2622f62-3126-45cd-85e0-0bc840c3afdc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-04T22%3A31%3A19Z&ske=2026-11-05T22%3A31%3A19Z&sks=b&skv=2026-02-06&sig=Xsv0XhTd7VaCACz7g4/6n/VjkauChBQJ8OWM93ZrNDE%3D","deshi-murgi-v3.jpg":"https://oaisdmntprcentralindia.blob.core.windows.net/files/00000000-2d88-8208-a3dd-bd9cef149b10/raw?se=2026-11-05T00%3A05%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=8b1de273-798c-4867-b205-57e47b7913fa&skoid=f2622f62-3126-45cd-85e0-0bc840c3afdc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-04T22%3A41%3A59Z&ske=2026-11-05T22%3A41%3A59Z&sks=b&skv=2026-02-06&sig=XGIBwVasc1JksKQAwYYmwRJqJP%2BqMeE7cb3lJXWzx90%3D","beef-biryani-v3.jpg":"https://oaisdmntprcentralindia.blob.core.windows.net/files/00000000-3638-8208-8871-fd7d4e231bcf/raw?se=2026-11-05T00%3A05%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=8b1de273-798c-4867-b205-57e47b7913fa&skoid=f2622f62-3126-45cd-85e0-0bc840c3afdc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-04T21%3A35%3A31Z&ske=2026-11-05T21%3A35%3A31Z&sks=b&skv=2026-02-06&sig=yUUhC/BFX/V%2BXJS/hHmdg08h/At61N9Qwier4WiVtDc%3D","chicken-biryani-v3.jpg":"https://oaisdmntprcentralindia.blob.core.windows.net/files/00000000-597c-8208-bf00-778183b6aa53/raw?se=2026-11-05T00%3A05%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=8b1de273-798c-4867-b205-57e47b7913fa&skoid=f2622f62-3126-45cd-85e0-0bc840c3afdc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-04T22%3A35%3A12Z&ske=2026-11-05T22%3A35%3A12Z&sks=b&skv=2026-02-06&sig=WraAg/sxy4IzHuP/Fjkop6RPpShBS9T2ko6ukUiJh4E%3D","mutton-biryani-v3.jpg":"https://oaisdmntprcentralindia.blob.core.windows.net/files/00000000-0530-8208-98c5-a49e454f6ab8/raw?se=2026-11-05T00%3A05%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=8b1de273-798c-4867-b205-57e47b7913fa&skoid=f2622f62-3126-45cd-85e0-0bc840c3afdc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-04T22%3A41%3A51Z&ske=2026-11-05T22%3A41%3A51Z&sks=b&skv=2026-02-06&sig=hK%2BL%2BA3xZ0nl1Llavt25EDEyjw2nyCm9jYmoqYY9jw0%3D","beef-polao-v3.jpg":"https://oaisdmntprcentralindia.blob.core.windows.net/files/00000000-fb90-8208-893c-7cf648969dfb/raw?se=2026-11-05T00%3A05%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=8b1de273-798c-4867-b205-57e47b7913fa&skoid=f2622f62-3126-45cd-85e0-0bc840c3afdc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-04T21%3A35%3A31Z&ske=2026-11-05T21%3A35%3A31Z&sks=b&skv=2026-02-06&sig=hdDbnR6BXy1O4TIn/E9hZC368OHQ%2Bc5pumAY3gedH1A%3D","mutton-polao-v3.jpg":"https://oaisdmntprcentralindia.blob.core.windows.net/files/00000000-b82c-8208-abeb-649a7f47877d/raw?se=2026-11-05T00%3A05%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=8b1de273-798c-4867-b205-57e47b7913fa&skoid=f2622f62-3126-45cd-85e0-0bc840c3afdc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-04T22%3A35%3A54Z&ske=2026-11-05T22%3A35%3A54Z&sks=b&skv=2026-02-06&sig=GqujILaW0v8ljam0E70h21XQiZERE4xEGI9Rz0TfCnM%3D","morog-polao-v3.jpg":"https://oaisdmntprcentralindia.blob.core.windows.net/files/00000000-14a0-8208-af0f-fc0f46cf1e7c/raw?se=2026-11-05T00%3A05%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=8b1de273-798c-4867-b205-57e47b7913fa&skoid=f2622f62-3126-45cd-85e0-0bc840c3afdc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-04T21%3A33%3A15Z&ske=2026-11-05T21%3A33%3A15Z&sks=b&skv=2026-02-06&sig=0LEWUmdaooWNTv8C%2B33TcY6w9mRkZWVxHgVYXRseNJg%3D","khashir-bhuna-v3.jpg":"https://oaisdmntprcentralindia.blob.core.windows.net/files/00000000-b794-8208-8a4c-799b87b48e0f/raw?se=2026-11-05T00%3A05%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=8b1de273-798c-4867-b205-57e47b7913fa&skoid=f2622f62-3126-45cd-85e0-0bc840c3afdc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-04T22%3A44%3A02Z&ske=2026-11-05T22%3A44%3A02Z&sks=b&skv=2026-02-06&sig=icqgrqa5HtcqOauUaKutsFX%2BFOG6XCGK238rg/K5DmE%3D"}
          LINKS = {"ME01":"gorur-kosha-bhuna-v3.jpg","CH01":"murgir-ran-fry-v3.jpg","SP01":"deshi-murgi-v3.jpg","BI01":"beef-biryani-v3.jpg","BI02":"chicken-biryani-v3.jpg","BI03":"mutton-biryani-v3.jpg","PO01":"beef-polao-v3.jpg","PO02":"mutton-polao-v3.jpg","PO03":"morog-polao-v3.jpg","ME03":"khashir-bhuna-v3.jpg"}
          pathlib.Path("menu-images").mkdir(exist_ok=True)
          for name,url in FILES.items():
              with urllib.request.urlopen(url,timeout=65) as resp:
                  raw=resp.read()
              im=Image.open(io.BytesIO(raw)).convert("RGB")
              im.thumbnail((640,640))
              im.save(pathlib.Path("menu-images")/name,format="JPEG",quality=75,optimize=True)
              print(name,im.size,flush=True)
          p=pathlib.Path("menu.csv")
          with p.open("r",encoding="utf-8-sig",newline="") as f:
              reader=csv.DictReader(f);headers=reader.fieldnames;rows=list(reader)
          seen=set()
          for row in rows:
              name=LINKS.get(row["id"])
              if name:
                  row["image_url"]="https://arkibria-tradeflow.github.io/kbn-restaurant/menu-images/"+name
                  row["image_file"]=name
                  seen.add(row["id"])
          assert len(seen)==len(LINKS),(seen,LINKS)
          with p.open("w",encoding="utf-8",newline="") as f:
              writer=csv.DictWriter(f,fieldnames=headers,lineterminator="\n");writer.writeheader();writer.writerows(rows)
                    PY
      - name: Commit menu photo files and links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu-images/ menu.csv
          if ! git diff --staged --quiet; then
            git commit -m "Add 10 correct KBN meat biryani and polao photos"
            git push origin HEAD:main
          fi
